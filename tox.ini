[tox]
envlist = py311,py312,py313,py314,py315,lint,coverage
isolated_build = true

[testenv]
deps = 
    pytest
    pytest-cov
commands = pytest {posargs}

[testenv:lint]
deps = ruff
commands = 
    ruff format --check src/ tests/
    ruff check src/ tests/

[testenv:format]
deps = ruff
commands = 
    ruff check src/ tests/ --fix
    ruff format src/ tests/

[testenv:coverage]
deps = 
    pytest
    pytest-cov
commands = 
    pytest --cov=taxdumpy --cov-report=term-missing --cov-report=html --cov-fail-under=80

[testenv:fast]
deps = 
    pytest
    pytest-cov
commands = 
    pytest -m "not slow and not integration" {posargs}

[testenv:integration]
deps = 
    pytest
    pytest-cov
commands = 
    pytest -m "integration" {posargs}
