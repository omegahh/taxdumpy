[tox]
envlist = py310,py311,py312,py313,lint,coverage
isolated_build = true

[testenv]
deps = 
    pytest
    pytest-cov
    pytest-mock
commands = pytest {posargs}

[testenv:lint]
deps = black
commands = 
    black --check src/ tests/

[testenv:format]
deps = black
commands = 
    black src/ tests/

[testenv:coverage]
deps = 
    pytest
    pytest-cov
    pytest-mock
commands = 
    pytest --cov=taxdumpy --cov-report=term-missing --cov-report=html --cov-fail-under=80

[testenv:fast]
deps = 
    pytest
    pytest-cov
    pytest-mock
commands = 
    pytest -m "not slow and not integration" {posargs}

[testenv:integration]
deps = 
    pytest
    pytest-cov
    pytest-mock
commands = 
    pytest -m "integration" {posargs}